            const GAME_CONFIG = { timeMs: 15000, feedbackMs: 2400 };
            const GAME_ROUNDS = [
                { id: 'game1', pool: GAME_POOL.filter((_, i) => i % 2 === 0) },
                { id: 'game2', pool: GAME_POOL.filter((_, i) => i % 2 === 1) }

            const LETTERS = ['A', 'B', 'C', 'D'];

            /* =====================================================================

               ===================================================================== */
            const $ = (sel, root = document) => root.querySelector(sel);
            const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
            const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);
            const reducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

            function shuffle(list) {
                const a = list.slice();
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

                        /* =====================================================================
               3. PENYIMPANAN & STATE
               ===================================================================== */
            const Store = (() => {
                const KEY = 'jejak-blambangan:v2';
                let persistent = true;
                let memoryCopy = null;
                try {
                    localStorage.setItem(KEY + ':probe', '1');
                    localStorage.removeItem(KEY + ':probe');
                } catch (err) {
                    persistent = false;
                }
                return {
                    isPersistent: persistent,
                    read() {
                        if (!persistent) return memoryCopy;
                        try {
                            const raw = localStorage.getItem(KEY);
                            return raw ? JSON.parse(raw) : null;
                        } catch (err) {
                            return null;
                        }
                    },
                    write(data) {
                        memoryCopy = JSON.parse(JSON.stringify(data));
                        if (!persistent) return false;
                        try {
                            localStorage.setItem(KEY, JSON.stringify(data));
                            return true;
                        } catch (err) {
                            return false;
                        }
                    },
                    clear() {
                        memoryCopy = null;
                        if (!persistent) return;
                        try { localStorage.removeItem(KEY); } catch (err) { /* abaikan */ }
                    }
                };
            })();

            function defaultState() {
                return {
                    v: 2,

                    materi: {

            }

            /* Memvalidasi data dari Local Storage agar data rusak atau dimanipulasi tidak merusak aplikasi. */
            function sanitizeState(raw) {
                const s = defaultState();
                if (!raw || typeof raw !== 'object') return s;
                if (typeof raw.name === 'string') s.name = raw.name.trim().slice(0, 40);
                const m = raw.materi;
                if (m && typeof m === 'object') {
                    CHAPTERS.forEach((c) => {
                        const done = !!(m.done && m.done[c.id] === true);
                        const p = m.progress ? Number(m.progress[c.id]) : 0;
                        s.materi.done[c.id] = done;
                        s.materi.progress[c.id] = done ? 100 : (Number.isFinite(p) ? clamp(Math.round(p), 0, 100) : 0);
                    });
                    if (CHAPTERS.some((c) => c.id === m.current)) s.materi.current = m.current;
                }
                const g = raw.game && Array.isArray(raw.game.rounds) ? raw.game.rounds : [];
                s.game.rounds = GAME_ROUNDS.map((_, i) => {
                    const r = g[i];
                    if (!r || typeof r !== 'object') return { best: 0, last: 0, plays: 0 };
                    return {
                        best: Number.isFinite(r.best) ? Math.max(0, Math.round(r.best)) : 0,
                        last: Number.isFinite(r.last) ? Math.max(0, Math.round(r.last)) : 0,
                        plays: Number.isInteger(r.plays) ? Math.max(0, r.plays) : 0
                    };
                });
                return s;
            }

            let state = sanitizeState(Store.read());
            const save = () => Store.write(state);

            /* =====================================================================
               4. ALUR TAHAPAN & GUARD
               ===================================================================== */
            const STAGES = [
                { id: 'daftar', kind: 'daftar', label: 'Mulai', title: 'Mulai' },
                { id: 'bab1', kind: 'bab', idx: 0, label: 'Bab 1', title: 'Bab 1' },
                { id: 'game1', kind: 'game', idx: 0, label: 'Game 1', title: 'Mini Game 1' },
                { id: 'bab2', kind: 'bab', idx: 1, label: 'Bab 2', title: 'Bab 2' },
                { id: 'game2', kind: 'game', idx: 1, label: 'Game 2', title: 'Mini Game 2' },
                { id: 'bab3', kind: 'bab', idx: 2, label: 'Bab 3', title: 'Bab 3' },
                { id: 'hasil', kind: 'hasil', label: 'Hasil', title: 'Hasil Belajar' }
            ];
            const ORDER = STAGES.map((s) => s.id);

            const hasName = () => state.name.length >= 2;
            const materiDone = () => CHAPTERS.every((c) => state.materi.done[c.id]);
            const chapterDone = (i) => !!state.materi.done[CHAPTERS[i].id];
            const gamePlayed = (i) => state.game.rounds[i].plays > 0;

            const PREREQS = [
                { stage: 'bab1', ok: hasName, msg: 'Isi nama siswa terlebih dahulu di halaman awal.' },
                { stage: 'game1', ok: () => chapterDone(0), msg: 'Tandai selesai Bab 1 sebelum bermain Game 1.' },
                { stage: 'bab2', ok: () => gamePlayed(0), msg: 'Mainkan Game 1 terlebih dahulu sebelum lanjut ke Bab 2.' },
                { stage: 'game2', ok: () => chapterDone(1), msg: 'Tandai selesai Bab 2 sebelum bermain Game 2.' },
                { stage: 'bab3', ok: () => gamePlayed(1), msg: 'Mainkan Game 2 terlebih dahulu sebelum lanjut ke Bab 3.' },
                { stage: 'hasil', ok: () => chapterDone(2), msg: 'Selesaikan Bab 3 untuk melihat dashboard hasil.' }
            ];

            function failedPrereqs(id) {
                const upto = ORDER.indexOf(id);
                return PREREQS.filter((p) => ORDER.indexOf(p.stage) <= upto && !p.ok());
            }
            const canAccess = (id) => ORDER.includes(id) && failedPrereqs(id).length === 0;
            const lockReason = (id) => (failedPrereqs(id)[0] || { msg: '' }).msg;

            /* Tahap yang harus dikerjakan berikutnya (selalu dapat diakses). */
            function nextStage() {
                const failed = PREREQS.find((p) => !p.ok());
                if (!failed) return 'hasil';
                return ORDER[ORDER.indexOf(failed.stage) - 1];
            }

            function isStageDone(id) {
                const st = STAGES.find((x) => x.id === id);
                if (!st) return false;
                if (st.kind === 'daftar') return hasName();
                if (st.kind === 'bab') return chapterDone(st.idx);
                if (st.kind === 'game') return gamePlayed(st.idx);
                return false;
            }

            /* =====================================================================
               5. HELPER UI (toast, pengumuman, konfeti, stepper)
               ===================================================================== */
            function toast(message, kind = 'info') {
                const root = $('#toast-root');
                const palette = { info: 'bg-bark text-sand', warn: 'bg-gold text-ink', success: 'bg-moss text-white', error: 'bg-brick text-white' };
                const el = document.createElement('div');
                el.className = 'toast pointer-events-auto rounded-xl px-4 py-3 text-sm font-medium shadow-xl ' + (palette[kind] || palette.info);
                el.textContent = message;
                root.appendChild(el);
                while (root.children.length > 3) root.removeChild(root.firstChild);
                setTimeout(() => {
                    el.classList.add('toast-out');
                    setTimeout(() => el.remove(), 320);
                }, 3600);
            }

            function announce(message) {
                const live = $('#sr-live');
                live.textContent = '';
                setTimeout(() => { live.textContent = message; }, 40);
            }

            function burst(count = 30) {
                if (reducedMotion()) return;
                const layer = $('#fx-layer');
                const colors = ['#c8963e', '#a4532b', '#4f6b3a', '#e8c98a', '#843f1f'];
                for (let i = 0; i < count; i++) {
                    const s = document.createElement('span');
                    s.className = 'confetti';
                    s.style.left = (8 + Math.random() * 84) + '%';
                    s.style.background = colors[i % colors.length];
                    s.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
                    s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                    s.style.animationDuration = (1.1 + Math.random() * 0.9) + 's';
                    s.style.animationDelay = (Math.random() * 0.15) + 's';
                    layer.appendChild(s);
                    setTimeout(() => s.remove(), 2500);
                }
            }

            let currentRoute = 'daftar';

            function renderStepper() {
                const nav = $('#stepper');
                const items = STAGES.map((st, i) => {
                    const active = st.id === currentRoute;
                    const locked = !canAccess(st.id);
                    const done = isStageDone(st.id) && !active;
                    const btnStyle = active ? 'bg-gold text-ink' : (locked ? 'text-sand/40 hover:bg-white/5' : 'text-sand hover:bg-white/10');
                    const dotStyle = active ? 'bg-ink text-gold' : (done ? 'bg-moss text-white' : (locked ? 'bg-white/10 text-sand/50' : 'bg-white/20 text-sand'));
                    return '<li class="flex shrink-0 items-center">' +
                        '<button type="button" data-stage="' + st.id + '"' + (active ? ' aria-current="step"' : '') + (locked ? ' aria-disabled="true"' : '') +
                        ' class="flex items-center gap-2 whitespace-nowrap rounded-full px-2.5 py-1.5 text-sm font-medium transition ' + btnStyle + '">' +
                        '<span class="inline-flex h-6 w-6 items-center justify-center rounded-full text-xs font-bold ' + dotStyle + '">' + (done ? '&#10003;' : (i + 1)) + '</span>' +
                        '<span class="hidden sm:inline">' + esc(st.label) + '</span></button>' +
                        (i < STAGES.length - 1 ? '<span class="mx-1 h-px w-3 bg-white/20 sm:w-5" aria-hidden="true"></span>' : '') +
                        '</li>';
                }).join('');
                nav.innerHTML = '<ol class="mx-auto flex max-w-6xl items-center overflow-x-auto px-3 py-2">' + items + '</ol>';
            }

            function go(id) {
                const target = '#/' + id;
                if (location.hash === target) handleRoute();
                else location.hash = target;
            }

            function requestStage(id) {
                if (!canAccess(id)) {
                    toast(lockReason(id), 'warn');
                    return;
                }
                go(id);
            }

            function resetAll() {
                if (!window.confirm('Hapus semua progres (nama, skor game, dan status materi) lalu mulai dari awal?')) return;
                Store.clear();
                state = defaultState();
                toast('Progres dihapus. Silakan mulai dari awal.', 'info');
                go('daftar');
            }

            /* =====================================================================
               6. VIEW: LANDING & PENDAFTARAN
               ===================================================================== */
            const NAME_RE = /^[\p{L}][\p{L}\p{M} .'’-]{1,39}$/u;

            function createLandingView() {
                const ac = new AbortController();
                return {
                    mount(root) {
                        const known = hasName();
                        const steps = [
                            ['1', 'Daftar', 'Isi nama siswa untuk menyimpan progres belajarmu.'],
                            ['2', 'Materi + Game', 'Baca 3 bab; di sela-sela bab ada mini game Kuis Kilat.'],
                            ['3', 'Hasil', 'Lihat ringkasan belajar dan skor game-mu.']
                        ];
                        const facts = [
                            'Blambangan dikenal sebagai kerajaan Hindu terakhir di Pulau Jawa.',
                            'Puncak Perang Bayu pada 18 Desember 1771 menjadi Hari Jadi Banyuwangi.',
                            'Seni Gandrung Banyuwangi berakar dari budaya masyarakat Blambangan.'
                        ];
                        const panel = known
                            ? '<div class="text-center">' +
                            '<p class="text-sm font-semibold uppercase tracking-widest text-clay">Selamat datang kembali</p>' +
                            '<p class="mt-1 font-display text-2xl font-bold text-bark break-words">' + esc(state.name) + '</p>' +
                            '<p class="mt-2 text-sm text-bark/70">Progres belajarmu tersimpan di peramban ini.</p>' +
                            '<button type="button" data-action="continue" class="btn btn-primary mt-5 w-full">Lanjutkan Belajar</button>' +
                            '<button type="button" data-action="new-user" class="mt-3 text-sm font-medium text-clay underline underline-offset-2 hover:text-clay-dark">Bukan kamu? Mulai dari awal</button>' +
                            '</div>'
                            : '<form id="name-form" novalidate class="space-y-4">' +
                            '<div><label for="student-name" class="block text-sm font-semibold text-bark">Nama siswa</label>' +
                            '<input id="student-name" name="name" type="text" autocomplete="name" maxlength="40" required placeholder="Contoh: Sari Wulandari" ' +
                            'class="mt-1 w-full rounded-xl border-2 border-clay/25 bg-white px-4 py-3 text-base focus:border-clay focus:outline-none">' +
                            '<p id="name-error" role="alert" class="mt-1 hidden text-sm font-medium text-brick"></p></div>' +
                            '<button type="submit" class="btn btn-primary w-full">Mulai Belajar</button>' +
                            '<p class="text-center text-xs text-bark/60">Namamu hanya disimpan di peramban ini (Local Storage).</p></form>';

                        root.innerHTML =
                            '<div class="space-y-10">' +
                            '<section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-bark via-[#5a3a25] to-clay text-sand shadow-xl">' +
                            '<div class="absolute -right-16 -top-16 h-72 w-72 rounded-full bg-gold/20 blur-2xl" aria-hidden="true"></div>' +
                            '<div class="relative grid gap-8 p-6 sm:p-10 lg:grid-cols-[1.2fr_1fr] lg:items-center">' +
                            '<div><p class="text-sm font-semibold uppercase tracking-widest text-gold">Belajar Sejarah Lokal</p>' +
                            '<h1 data-focus tabindex="-1" class="mt-3 font-display text-4xl font-extrabold leading-tight sm:text-5xl">Jejak Kerajaan Blambangan</h1>' +
                            '<p class="mt-4 max-w-xl text-lg text-sand/90">Telusuri kisah kerajaan Hindu terakhir di tanah Jawa: dari asal-usulnya, keberanian Pangeran Jagapati dalam Perang Bayu, hingga warisan budayanya yang masih hidup di Banyuwangi.</p>' +
                            '<ul class="mt-6 flex flex-wrap gap-2 text-sm"><li class="rounded-full bg-white/10 px-3 py-1">Materi Interaktif</li><li class="rounded-full bg-white/10 px-3 py-1">Mini Game</li></ul></div>' +
                            '<div class="card p-6 text-ink">' + panel + '</div></div></section>' +
                            '<section aria-labelledby="alur-title"><h2 id="alur-title" class="font-display text-2xl font-bold text-bark">Alur Belajar</h2>' +
                            '<ol class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">' +
                            steps.map((s) => '<li class="card p-4"><span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-clay text-sm font-bold text-white">' + s[0] + '</span>' +
                                '<h3 class="mt-3 font-semibold text-bark">' + esc(s[1]) + '</h3><p class="mt-1 text-sm text-bark/70">' + esc(s[2]) + '</p></li>').join('') +
                            '</ol></section>' +
                            '<section aria-labelledby="fakta-title"><h2 id="fakta-title" class="font-display text-2xl font-bold text-bark">Tahukah Kamu?</h2>' +
                            '<ul class="mt-4 grid gap-4 md:grid-cols-3">' +
                            facts.map((f) => '<li class="rounded-2xl border-l-4 border-gold bg-sand p-4 text-bark">' + esc(f) + '</li>').join('') +
                            '</ul></section></div>';

                        root.addEventListener('submit', (e) => {
                            if (e.target.id !== 'name-form') return;
                            e.preventDefault();
                            const input = $('#student-name', root);
                            const error = $('#name-error', root);
                            const value = input.value.replace(/\s+/g, ' ').trim();
                            if (!NAME_RE.test(value)) {
                                error.textContent = 'Nama harus 2-40 karakter, diawali huruf, dan hanya berisi huruf, spasi, titik, apostrof, atau tanda hubung.';
                                error.classList.remove('hidden');
                                input.setAttribute('aria-invalid', 'true');
                                input.focus();
                                return;
                            }
                            state.name = value;
                            save();
                            renderStepper();
                            toast('Halo, ' + value + '! Selamat belajar.', 'success');
                            go(nextStage());
                        }, { signal: ac.signal });

                        root.addEventListener('click', (e) => {
                            const btn = e.target.closest('[data-action]');
                            if (!btn || !root.contains(btn)) return;
                            if (btn.dataset.action === 'continue') go(nextStage());
                            if (btn.dataset.action === 'new-user') resetAll();
                        }, { signal: ac.signal });
                    },
                    destroy() { ac.abort(); }
                };
            }

            /* =====================================================================
               7. VIEW: MODUL MATERI
               ===================================================================== */
            function createMateriView(ci) {
                const ac = new AbortController();
                let root = null;
                let rafId = 0;
                let lastSaved = 0;

                const chapter = () => CHAPTERS[ci];
                const doneCount = () => CHAPTERS.filter((c) => state.materi.done[c.id]).length;

                function sidebarHtml() {
                    const items = CHAPTERS.map((c, idx) => {
                        const active = c.id === chapter().id;
                        const done = state.materi.done[c.id];
                        const p = state.materi.progress[c.id];
                        return '<li><button type="button" data-action="select-chapter" data-id="' + c.id + '"' + (active ? ' aria-current="true"' : '') +
                            ' class="w-full rounded-xl border-2 p-3 text-left transition ' + (active ? 'border-clay bg-sand' : 'border-transparent bg-white hover:border-clay/40') + (canAccess('bab' + (idx + 1)) ? '' : ' opacity-60') + '">' +
                            '<div class="flex items-center gap-3"><span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-sm font-bold ' + (done ? 'bg-moss text-white' : 'bg-clay text-white') + '">' + (done ? '&#10003;' : (idx + 1)) + '</span>' +
                            '<div class="min-w-0"><p class="text-sm font-semibold text-bark">' + esc(c.title) + '</p><p class="text-xs text-bark/60">' + c.minutes + ' menit baca</p></div></div>' +
                            '<div class="mt-2 h-1.5 overflow-hidden rounded-full bg-sand"><div class="h-1.5 rounded-full ' + (done ? 'bg-moss' : 'bg-gold') + '" style="width:' + p + '%"></div></div></button></li>';
                    }).join('');
                    return '<aside class="space-y-4 lg:sticky lg:top-36 lg:self-start" aria-label="Daftar bab">' +
                        '<div class="card p-4"><p class="text-sm font-semibold text-bark">Progres Materi</p>' +
                        '<p class="mt-1 text-2xl font-extrabold text-bark">' + doneCount() + ' / ' + CHAPTERS.length + ' <span class="text-sm font-medium text-bark/60">bab selesai</span></p>' +
                        '<div class="mt-2 h-2 overflow-hidden rounded-full bg-sand"><div class="h-2 rounded-full bg-moss transition-all" style="width:' + pct(doneCount(), CHAPTERS.length) + '%"></div></div></div>' +
                        '<ul class="space-y-2">' + items + '</ul></aside>';
                }

                function articleHtml() {
                    const c = chapter();
                    const idx = CHAPTERS.indexOf(c);
                    const sections = c.sections.map((s) =>
                        '<section><h2 class="mt-8 font-display text-2xl font-bold text-bark">' + esc(s.heading) + '</h2>' +
                        s.paragraphs.map((p) => '<p>' + esc(p) + '</p>').join('') + '</section>').join('');
                    const timeline = c.timeline.length
                        ? '<h2 class="mt-10 font-display text-2xl font-bold text-bark">Garis Waktu</h2><ol class="relative my-5 ml-2 space-y-5 border-l-2 border-clay/30 pl-6">' +
                        c.timeline.map((t) => '<li class="relative"><span class="absolute -left-[33px] top-1.5 h-4 w-4 rounded-full border-4 border-paper bg-clay"></span>' +
                            '<p class="text-sm font-bold text-clay">' + esc(t.year) + '</p><p class="text-bark">' + esc(t.text) + '</p></li>').join('') + '</ol>'
                        : '';
                    const points = '<div class="mt-8 rounded-2xl border-l-4 border-gold bg-sand p-5"><p class="font-semibold text-bark">Poin Penting</p><ul class="mt-2 list-disc space-y-1 pl-5 text-bark">' +
                        c.keyPoints.map((k) => '<li>' + esc(k) + '</li>').join('') + '</ul></div>';

                    const done = state.materi.done[c.id];
                    const prev = CHAPTERS[idx - 1];
                    const nxt = CHAPTERS[idx + 1];

                    return '<div class="min-w-0"><article id="chapter-article" class="card p-6 sm:p-10">' +
                        '<p class="text-sm font-semibold uppercase tracking-widest text-clay">Bab ' + (idx + 1) + ' dari ' + CHAPTERS.length + '</p>' +
                        '<h1 data-focus tabindex="-1" class="mt-1 font-display text-3xl font-bold text-bark sm:text-4xl">' + esc(c.title) + '</h1>' +
                        '<p class="mt-1 text-bark/70">' + esc(c.tagline) + '</p>' +
                        '<div class="read-text">' + sections + '</div>' + timeline + points + '</article>' +
                        '<div class="card mt-6 p-5">' +
                        '<div class="flex items-center justify-between text-sm font-medium text-bark"><span>Progres membaca bab ini</span><span id="chapter-pct">0%</span></div>' +
                        '<div class="mt-2 h-2.5 overflow-hidden rounded-full bg-sand"><div id="chapter-bar" class="h-2.5 rounded-full bg-gold" style="width:0%;transition:width .2s linear"></div></div>' +
                        '<p id="complete-hint" class="mt-2 text-xs text-bark/60"></p>' +
                        '<button id="complete-btn" type="button" data-action="complete" class="btn ' + (done ? 'btn-secondary' : 'btn-primary') + ' mt-4 w-full sm:w-auto">' + (done ? 'Bab ini sudah selesai &#10003;' : 'Tandai Bab Selesai') + '</button>' +
                        '<div class="mt-5 flex flex-wrap items-center justify-between gap-3 border-t border-clay/15 pt-4">' +
                        '<button type="button" data-action="select-chapter" data-id="' + (prev ? prev.id : '') + '" class="btn btn-secondary"' + (prev ? '' : ' disabled') + '>&larr; Bab Sebelumnya</button>' +
                        '<button type="button" data-action="to-next" class="btn btn-secondary"' + (done ? '' : ' disabled') + '>' + (nxt ? 'Lanjut ke Mini Game ' + (idx + 1) : 'Lihat Hasil') + ' &rarr;</button></div>' +
                        (done
                            ? '<div class="mt-5 rounded-xl bg-moss-light p-4 text-moss"><p class="font-semibold">' + (nxt ? 'Bab selesai! Saatnya istirahat sejenak dengan mini game.' : 'Semua bab selesai! Dashboard hasil sudah terbuka.') + '</p>' +
                            '<button type="button" data-action="to-next" class="btn btn-gold mt-3">' + (nxt ? 'Main Mini Game ' + (idx + 1) : 'Lihat Hasil Belajar') + ' &rarr;</button></div>'
                            : '') +
                        '</div></div>';
                }

                function render(scroll) {
                    root.innerHTML = '<div class="grid gap-8 lg:grid-cols-[18rem_1fr]">' + sidebarHtml() + articleHtml() + '</div>';
                    lastSaved = state.materi.progress[chapter().id];
                    updateProgressUI();
                    if (scroll) window.scrollTo({ top: 0, left: 0 });
                    schedule();
                }

                /* Memperbarui bar progres, tombol selesai, dan bar di header tanpa render ulang. */
                function updateProgressUI() {
                    const c = chapter();
                    const done = state.materi.done[c.id];
                    const p = done ? 100 : state.materi.progress[c.id];
                    const bar = $('#chapter-bar', root);
                    const label = $('#chapter-pct', root);
                    const btn = $('#complete-btn', root);
                    const hint = $('#complete-hint', root);
                    const header = $('#read-progress');
                    if (bar) bar.style.width = p + '%';
                    if (label) label.textContent = p + '%';
                    if (header) header.style.width = p + '%';
                    if (btn) btn.disabled = done || p < 95;
                    if (hint) hint.textContent = done ? '' : (p >= 95 ? 'Kamu sudah membaca sampai akhir. Tandai bab ini selesai.' : 'Gulir hingga akhir bab untuk mengaktifkan tombol selesai.');
                }

                function measure() {
                    rafId = 0;
                    const art = $('#chapter-article', root);
                    if (!art) return;
                    const c = chapter();
                    if (state.materi.done[c.id]) return;
                    const rect = art.getBoundingClientRect();
                    const seen = clamp(window.innerHeight - rect.top, 0, rect.height);
                    const p = rect.height > 0 ? Math.floor((seen / rect.height) * 100) : 100;
                    if (p > state.materi.progress[c.id]) {
                        state.materi.progress[c.id] = p;
                        if (p - lastSaved >= 5 || p >= 95) {
                            save();
                            lastSaved = p;
                        }
                        updateProgressUI();
                    }
                }

                function schedule() {
                    if (!rafId) rafId = requestAnimationFrame(measure);
                }

                function selectChapter(id) {
                    const n = CHAPTERS.findIndex((c) => c.id === id);
                    if (n < 0) return;
                    save();
                    requestStage('bab' + (n + 1));
                }

                function complete() {
                    const c = chapter();
                    if (state.materi.done[c.id]) return;
                    if (state.materi.progress[c.id] < 95) {
                        toast('Baca sampai akhir bab terlebih dahulu.', 'warn');
                        return;
                    }
                    state.materi.done[c.id] = true;
                    state.materi.progress[c.id] = 100;
                    save();
                    renderStepper();
                    if (ci === CHAPTERS.length - 1) {
                        toast('Semua bab selesai! Dashboard hasil terbuka.', 'success');
                        burst(24);
                    } else {
                        toast('Bab "' + c.title + '" selesai. Mini game terbuka.', 'success');
                    }
                    render(false);
                }

                return {
                    mount(el) {
                        root = el;
                        render(false);
                        root.addEventListener('click', (e) => {
                            const btn = e.target.closest('[data-action]');
                            if (!btn || !root.contains(btn) || btn.disabled) return;
                            switch (btn.dataset.action) {
                                case 'select-chapter': selectChapter(btn.dataset.id); break;
                                case 'complete': complete(); break;
                                case 'to-next': requestStage(ci < CHAPTERS.length - 1 ? 'game' + (ci + 1) : 'hasil'); break;
                                default: break;
                            }
                        }, { signal: ac.signal });
                        window.addEventListener('scroll', schedule, { passive: true, signal: ac.signal });
                        window.addEventListener('resize', schedule, { signal: ac.signal });
                    },
                    destroy() {
                        ac.abort();
                        if (rafId) cancelAnimationFrame(rafId);
                        save();
                        const header = $('#read-progress');
                        if (header) header.style.width = '0%';
                    }
                };
            }

            /* =====================================================================
               8. VIEW: MINI GAME "KUIS KILAT BLAMBANGAN"
               ===================================================================== */
            function gameRank(rawScore, total) {
                const score = rawScore * 10 / total; // skala ke 10 soal agar ambang tetap adil
                if (score >= 2200) return { title: 'Senopati Blambangan', note: 'Pengetahuan dan kecepatanmu luar biasa!' };
                if (score >= 1500) return { title: 'Prajurit Tangguh', note: 'Hebat! Sedikit lagi menjadi senopati.' };
                if (score >= 800) return { title: 'Pelajar Giat', note: 'Bagus! Ulangi untuk mengejar skor lebih tinggi.' };
                return { title: 'Calon Pejuang', note: 'Baca ulang materi, lalu coba lagi.' };
            }

            function createGameView(round) {
                const ac = new AbortController();
                const { timeMs: TIME_MS, feedbackMs: FEEDBACK_MS } = GAME_CONFIG;
                const POOL = GAME_ROUNDS[round].pool;
                const TOTAL = POOL.length;
                const G = () => state.game.rounds[round];
                let root = null;
                let phase = 'intro'; // intro | question | feedback | result
                let deck = [];
                let idx = 0;
                let score = 0;
                let shownScore = 0;
                let streak = 0;
                let bestStreak = 0;
                let correctCount = 0;
                let deadline = 0;
                let leftAtAnswer = 0;
                let lastResult = null;
                let timerId = 0;
                let advanceId = 0;
                let tweenId = 0;
                let newBest = false;

                function stopTimer() { if (timerId) { clearInterval(timerId); timerId = 0; } }
                function stopAdvance() { if (advanceId) { clearTimeout(advanceId); advanceId = 0; } }
                function stopTween() { if (tweenId) { cancelAnimationFrame(tweenId); tweenId = 0; } }
                function settleScore() { stopTween(); shownScore = score; }

                function introHtml() {
                    const best = G().best;
                    return '<div class="mx-auto max-w-2xl"><div class="mb-6"><p class="text-sm font-semibold uppercase tracking-widest text-clay">Mini Game ' + (round + 1) + ' dari ' + GAME_ROUNDS.length + ' &middot; setelah Bab ' + (round + 1) + '</p>' +
                        '<h1 data-focus tabindex="-1" class="font-display text-3xl font-bold text-bark">Kuis Kilat Blambangan</h1>' +
                        '<p class="mt-1 text-bark/70">Jawab cepat dan tepat untuk mengumpulkan skor setinggi-tingginya.</p></div>' +
                        '<div class="card p-6 sm:p-8"><h2 class="font-semibold text-bark">Aturan Main</h2>' +
                        '<ul class="mt-3 space-y-2 text-bark/90">' +
                        '<li class="flex gap-3"><span class="font-bold text-clay">1.</span><span>' + TOTAL + ' soal acak, masing-masing dengan waktu ' + (TIME_MS / 1000) + ' detik.</span></li>' +
                        '<li class="flex gap-3"><span class="font-bold text-clay">2.</span><span>Jawaban benar bernilai 100 poin ditambah 10 poin untuk setiap detik tersisa.</span></li>' +
                        '<li class="flex gap-3"><span class="font-bold text-clay">3.</span><span>Bonus +50 poin setiap jawaban benar beruntun mulai dari yang ketiga.</span></li>' +
                        '<li class="flex gap-3"><span class="font-bold text-clay">4.</span><span>Jawaban salah atau waktu habis memutus rangkaian beruntunmu.</span></li></ul>' +
                        '<div class="mt-5 rounded-xl bg-sand p-4 text-center"><p class="text-sm text-bark/70">Skor terbaikmu</p><p class="font-display text-3xl font-extrabold text-bark">' + best + '</p></div>' +
                        '<div class="mt-6 flex flex-wrap gap-3"><button type="button" data-action="start" data-focus-start class="btn btn-primary">Mulai Bermain</button>' +
                        (G().plays > 0 ? '<button type="button" data-action="to-next" class="btn btn-secondary">Lanjut ke Bab ' + (round + 2) + '</button>' : '') + '</div></div></div>';
                }

                function questionHtml() {
                    const q = deck[idx];
                    const feedback = phase === 'feedback';
                    const left = feedback ? leftAtAnswer : TIME_MS;
                    const options = q.opts.map((o, k) => {
                        let cls = 'border-clay/20 bg-white hover:border-clay hover:bg-sand';
                        let badge = 'bg-sand text-bark';
                        if (feedback) {
                            if (o.correct) { cls = 'border-moss bg-moss-light'; badge = 'bg-moss text-white'; }
                            else if (k === lastResult.picked) { cls = 'border-brick bg-brick-light'; badge = 'bg-brick text-white'; }
                            else { cls = 'border-transparent bg-white/60 opacity-70'; }
                        }
                        return '<button type="button" data-action="answer" data-index="' + k + '"' + (feedback ? ' disabled' : '') +
                            ' class="flex w-full items-start gap-3 rounded-xl border-2 px-4 py-3 text-left transition ' + cls + '">' +
                            '<span class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg text-sm font-bold ' + badge + '">' + LETTERS[k] + '</span>' +
                            '<span class="pt-0.5">' + esc(o.text) + '</span></button>';
                    }).join('');

                    let feedbackHtml = '';
                    if (feedback) {
                        const ok = lastResult.ok;
                        feedbackHtml = '<div class="mt-5 rounded-xl p-4 ' + (ok ? 'bg-moss-light text-moss' : 'bg-brick-light text-brick') + '">' +
                            '<p class="font-semibold">' + (ok ? 'Benar! +' + lastResult.gain + ' poin' : (lastResult.timedOut ? 'Waktu habis!' : 'Kurang tepat.')) + '</p>' +
                            (ok ? '' : '<p class="mt-1 text-sm">Jawaban benar: <strong>' + esc(q.opts.find((o) => o.correct).text) + '</strong></p>') +
                            '<p class="mt-1 text-sm text-ink/80">' + esc(q.explain) + '</p>' +
                            '<button type="button" data-action="advance" class="btn btn-primary mt-3">' + (idx + 1 >= TOTAL ? 'Lihat Hasil' : 'Soal Berikutnya') + ' &rarr;</button></div>';
                    }

                    const barColor = left / TIME_MS > 0.5 ? '#4f6b3a' : (left / TIME_MS > 0.25 ? '#c8963e' : '#a63a2b');
                    const cardFx = feedback ? (lastResult.ok ? ' fx-correct' : ' fx-wrong') : '';

                    return '<div class="mx-auto max-w-2xl"><h1 data-focus tabindex="-1" class="sr-only">Kuis Kilat Blambangan</h1>' +
                        '<div class="mb-4 flex items-center justify-between gap-3">' +
                        '<div><p class="text-xs font-semibold uppercase tracking-widest text-clay">Soal</p><p class="text-xl font-extrabold text-bark">' + (idx + 1) + ' / ' + TOTAL + '</p></div>' +
                        '<div class="flex items-center gap-2' + (streak >= 3 ? '' : ' opacity-60') + '"><span class="rounded-full bg-gold px-3 py-1 text-sm font-bold text-ink">Beruntun x' + streak + '</span></div>' +
                        '<div class="relative text-right"><p class="text-xs font-semibold uppercase tracking-widest text-clay">Skor</p><p id="score-value" class="text-xl font-extrabold text-bark" aria-live="off">' + shownScore + '</p>' +
                        (feedback && lastResult.ok ? '<span class="gain-pop absolute right-0 top-full text-sm font-bold text-moss">+' + lastResult.gain + '</span>' : '') + '</div></div>' +
                        '<div class="mb-4 flex items-center gap-3"><div class="h-3 flex-1 overflow-hidden rounded-full bg-sand" role="progressbar" aria-label="Sisa waktu">' +
                        '<div id="timer-bar" class="h-3 rounded-full" style="width:' + (left / TIME_MS * 100) + '%;background-color:' + barColor + ';transition:width .1s linear"></div></div>' +
                        '<span id="timer-text" class="w-10 text-right text-sm font-bold tabular-nums text-bark">' + Math.ceil(left / 1000) + 's</span></div>' +
                        '<div class="card p-5 sm:p-8' + cardFx + '"><h2 class="text-xl font-semibold leading-snug text-bark">' + esc(q.q) + '</h2>' +
                        '<div class="mt-5 space-y-3">' + options + '</div>' + feedbackHtml + '</div>' +
                        '<p class="mt-3 hidden text-center text-xs text-bark/50 sm:block">Tips: tekan 1-4 untuk menjawab cepat.</p></div>';
                }

                function resultHtml() {
                    const rank = gameRank(score, TOTAL);
                    const accuracy = pct(correctCount, TOTAL);
                    return '<div class="mx-auto max-w-2xl"><div class="card p-6 text-center sm:p-10">' +
                        '<p class="text-sm font-semibold uppercase tracking-widest text-clay">Permainan Selesai</p>' +
                        '<h1 data-focus tabindex="-1" class="mt-1 font-display text-3xl font-bold text-bark">' + esc(rank.title) + '</h1>' +
                        '<p class="mt-1 text-bark/70">' + esc(rank.note) + '</p>' +
                        '<p class="mt-6 font-display text-6xl font-extrabold text-bark">' + score + '</p><p class="text-sm text-bark/60">poin' + (newBest ? ' &middot; <strong class="text-moss">Rekor baru!</strong>' : '') + '</p>' +
                        '<dl class="mt-6 grid grid-cols-3 gap-3 text-center">' +
                        '<div class="rounded-xl bg-sand p-3"><dt class="text-xs text-bark/60">Benar</dt><dd class="text-lg font-bold text-bark">' + correctCount + '/' + TOTAL + '</dd></div>' +
                        '<div class="rounded-xl bg-sand p-3"><dt class="text-xs text-bark/60">Akurasi</dt><dd class="text-lg font-bold text-bark">' + accuracy + '%</dd></div>' +
                        '<div class="rounded-xl bg-sand p-3"><dt class="text-xs text-bark/60">Beruntun terbaik</dt><dd class="text-lg font-bold text-bark">x' + bestStreak + '</dd></div></dl>' +
                        '<p class="mt-4 text-sm text-bark/70">Skor terbaik: <strong>' + G().best + '</strong></p>' +
                        '<div class="mt-6 flex flex-wrap justify-center gap-3"><button type="button" data-action="start" class="btn btn-secondary">Main Lagi</button>' +
                        '<button type="button" data-action="to-next" class="btn btn-primary">Lanjut ke Bab ' + (round + 2) + ' &rarr;</button></div></div></div>';
                }

                function render() {
                    if (phase === 'intro') root.innerHTML = introHtml();
                    else if (phase === 'result') root.innerHTML = resultHtml();
                    else root.innerHTML = questionHtml();
                }

                function updateTimerUI(left) {
                    const bar = $('#timer-bar', root);
                    const text = $('#timer-text', root);
                    if (bar) {
                        bar.style.width = (left / TIME_MS * 100) + '%';
                        bar.style.backgroundColor = left / TIME_MS > 0.5 ? '#4f6b3a' : (left / TIME_MS > 0.25 ? '#c8963e' : '#a63a2b');
                    }
                    if (text) text.textContent = Math.ceil(left / 1000) + 's';
                }

                function tick() {
                    const left = Math.max(0, deadline - performance.now());
                    updateTimerUI(left);
                    if (left <= 0) {
                        stopTimer();
                        resolveAnswer(-1);
                    }
                }

                function startTimer() {
                    stopTimer();
                    deadline = performance.now() + TIME_MS;
                    timerId = setInterval(tick, 100);
                }

                function tweenScore(from, to) {
                    stopTween();
                    if (reducedMotion() || from === to) { shownScore = to; const el0 = $('#score-value', root); if (el0) el0.textContent = String(to); return; }
                    const start = performance.now();
                    const duration = 500;
                    const step = (now) => {
                        const t = clamp((now - start) / duration, 0, 1);
                        shownScore = Math.round(from + (to - from) * t);
                        const el = $('#score-value', root);
                        if (!el) { tweenId = 0; return; }
                        el.textContent = String(shownScore);
                        tweenId = t < 1 ? requestAnimationFrame(step) : 0;
                    };
                    tweenId = requestAnimationFrame(step);
                }

                function startGame() {
                    stopTimer(); stopAdvance(); stopTween();
                    deck = shuffle(POOL).map((q) => ({
                        q: q.q,
                        explain: q.explain,
                        opts: shuffle(q.options.map((text, i) => ({ text, correct: i === q.answer })))
                    }));
                    idx = 0; score = 0; shownScore = 0; streak = 0; bestStreak = 0; correctCount = 0; newBest = false;
                    showQuestion();
                }

                function showQuestion() {
                    phase = 'question';
                    lastResult = null;
                    render();
                    startTimer();
                    const h = $('[data-focus]', root);
                    if (h) h.focus({ preventScroll: true });
                }

                function resolveAnswer(optIndex) {
                    if (phase !== 'question') return;
                    phase = 'feedback';
                    stopTimer();
                    leftAtAnswer = optIndex === -1 ? 0 : Math.max(0, deadline - performance.now());
                    const chosen = deck[idx].opts[optIndex];
                    const ok = !!(chosen && chosen.correct);
                    let gain = 0;
                    if (ok) {
                        streak += 1;
                        bestStreak = Math.max(bestStreak, streak);
                        correctCount += 1;
                        gain = 100 + Math.ceil(leftAtAnswer / 1000) * 10 + (streak >= 3 ? 50 : 0);
                    } else {
                        streak = 0;
                    }
                    lastResult = { picked: optIndex, ok, gain, timedOut: optIndex === -1 };
                    const before = score;
                    score += gain;
                    render();
                    tweenScore(before, score);
                    if (ok) burst(16);
                    announce(ok ? 'Benar, ' + gain + ' poin.' : (lastResult.timedOut ? 'Waktu habis.' : 'Jawaban salah.'));
                    stopAdvance();
                    advanceId = setTimeout(advance, FEEDBACK_MS);
                }

                function advance() {
                    if (phase !== 'feedback') return;
                    stopAdvance();
                    settleScore();
                    idx += 1;
                    if (idx >= TOTAL) finishGame();
                    else showQuestion();
                }

                function finishGame() {
                    phase = 'result';
                    stopTimer(); stopAdvance();
                    settleScore();
                    newBest = score > G().best;
                    G().plays += 1;
                    G().last = score;
                    if (newBest) G().best = score;
                    save();
                    renderStepper();
                    render();
                    announce('Permainan selesai. Skor ' + score + '.');
                    if (correctCount >= 6) burst(40);
                    const h = $('[data-focus]', root);
                    if (h) h.focus({ preventScroll: true });
                    window.scrollTo({ top: 0, left: 0 });
                }

                return {
                    mount(el) {
                        root = el;
                        phase = 'intro';
                        render();
                        root.addEventListener('click', (e) => {
                            const btn = e.target.closest('[data-action]');
                            if (!btn || !root.contains(btn) || btn.disabled) return;
                            switch (btn.dataset.action) {
                                case 'start': startGame(); break;
                                case 'answer': if (phase === 'question') resolveAnswer(Number(btn.dataset.index)); break;
                                case 'advance': advance(); break;
                                case 'to-next': requestStage('bab' + (round + 2)); break;
                                default: break;
                            }
                        }, { signal: ac.signal });
                        document.addEventListener('keydown', (e) => {
                            if (e.altKey || e.ctrlKey || e.metaKey || e.defaultPrevented || phase !== 'question') return;
                            if (e.key >= '1' && e.key <= '4' && Number(e.key) - 1 < deck[idx].opts.length) resolveAnswer(Number(e.key) - 1);
                        }, { signal: ac.signal });
                    },
                    destroy() {
                        ac.abort();
                        stopTimer(); stopAdvance(); stopTween();
                    }
                };
            }

            /* =====================================================================
               10. VIEW: DASHBOARD HASIL
               ===================================================================== */
            function createResultView() {
                const ac = new AbortController();
                return {
                    mount(root) {
                        const rounds = state.game.rounds;
                        const totalBest = rounds.reduce((sum, r) => sum + r.best, 0);
                        const totalPlays = rounds.reduce((sum, r) => sum + r.plays, 0);
                        const rank = gameRank(totalBest / rounds.length, GAME_ROUNDS[0].pool.length);
                        const stat = (label, value) => '<div class="rounded-xl bg-sand p-4"><dt class="text-sm text-bark/60">' + label + '</dt><dd class="text-2xl font-extrabold text-bark">' + value + '</dd></div>';

                        root.innerHTML =
                            '<div class="mx-auto max-w-4xl space-y-6">' +
                            '<div class="card overflow-hidden"><div class="bg-gradient-to-r from-bark to-clay p-6 text-sand sm:p-8">' +
                            '<p class="text-sm font-semibold uppercase tracking-widest text-gold">Dashboard Hasil Belajar</p>' +
                            '<h1 data-focus tabindex="-1" class="mt-1 font-display text-3xl font-bold sm:text-4xl">Selamat, materi tuntas!</h1>' +
                            '<p class="mt-2 break-words text-sand/90">Siswa: <strong>' + esc(state.name) + '</strong></p></div>' +
                            '<div class="p-6 sm:p-8"><p class="text-bark/80">Kamu telah menyelesaikan seluruh bab tentang Kerajaan Blambangan dan memainkan mini game di sela-sela materi.</p>' +
                            '<p class="mt-4 font-display text-2xl font-bold text-bark">' + esc(rank.title) + '</p><p class="text-bark/70">' + esc(rank.note) + '</p></div></div>' +
                            '<section class="card p-6 sm:p-8"><h2 class="font-display text-2xl font-bold text-bark">Ringkasan Aktivitas</h2>' +
                            '<dl class="mt-4 grid gap-3 sm:grid-cols-3">' +
                            stat('Bab materi selesai', CHAPTERS.filter((c) => state.materi.done[c.id]).length + ' / ' + CHAPTERS.length) +
                            stat('Skor terbaik Game 1', rounds[0].best) +
                            stat('Skor terbaik Game 2', rounds[1].best) +
                            stat('Total skor terbaik', totalBest) +
                            stat('Game dimainkan', totalPlays + 'x') + '</dl></section>' +
                            '<div class="no-print flex flex-wrap gap-3"><button type="button" data-action="print" class="btn btn-primary">Cetak / Simpan PDF</button>' +
                            '<button type="button" data-action="review" class="btn btn-secondary">Pelajari Materi Lagi</button>' +
                            '<button type="button" data-action="restart" class="btn btn-secondary">Mulai Ulang Semua</button></div></div>';

                        root.addEventListener('click', (e) => {
                            const btn = e.target.closest('[data-action]');
                            if (!btn || !root.contains(btn)) return;
                            if (btn.dataset.action === 'print') window.print();
                            if (btn.dataset.action === 'review') go('bab1');
                            if (btn.dataset.action === 'restart') resetAll();
                        }, { signal: ac.signal });

                        burst(36);
                        announce('Dashboard hasil dimuat. Total skor game ' + totalBest + '.');
                    },
                    destroy() { ac.abort(); }
                };
            }

            /* =====================================================================
               9. ROUTER
               ===================================================================== */
            const VIEWS = { daftar: createLandingView, hasil: createResultView };
            STAGES.forEach((st) => {
                if (st.kind === 'bab') VIEWS[st.id] = () => createMateriView(st.idx);
                if (st.kind === 'game') VIEWS[st.id] = () => createGameView(st.idx);
            });

            let currentView = null;

            function replaceHash(id) {
                const target = '#/' + id;
                if (location.hash === target) handleRoute();
                else location.replace(target);
            }

            function mountView(id) {
                const root = $('#app');
                if (currentView) { currentView.destroy(); currentView = null; }
                root.innerHTML = '';
                currentRoute = id;
                currentView = VIEWS[id]();
                currentView.mount(root);
                root.classList.remove('view-enter');
                void root.offsetWidth;
                root.classList.add('view-enter');
                renderStepper();
                const stage = STAGES.find((s) => s.id === id);
                document.title = stage.title + ' | Jejak Blambangan';
                window.scrollTo({ top: 0, left: 0 });
                const focusEl = $('[data-focus-start], [data-focus]', root);
                if (focusEl) focusEl.focus({ preventScroll: true });
            }

            function handleRoute() {
                const match = location.hash.match(/^#\/([a-z0-9]+)\/?$/);
                const id = match ? match[1] : (location.hash === '' || location.hash === '#' ? 'daftar' : null);
                if (id === null || !VIEWS[id]) { replaceHash('daftar'); return; }
                if (!canAccess(id)) {
                    toast(lockReason(id), 'warn');
                    replaceHash(nextStage());
                    return;
                }
                mountView(id);
            }

            /* =====================================================================
               11. INISIALISASI
               ===================================================================== */
            function init() {
                $('#btn-reset').addEventListener('click', resetAll);
                $('#stepper').addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-stage]');
                    if (btn) requestStage(btn.dataset.stage);
                });
                window.addEventListener('hashchange', handleRoute);
                if (!Store.isPersistent) {
                    toast('Penyimpanan peramban tidak tersedia. Progres hanya tersimpan selama halaman terbuka.', 'warn');
                }
                handleRoute();
            }

            init();
        })();
    </script>
</body>

</html>
