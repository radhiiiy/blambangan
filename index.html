            /* ---------- Game 1: Puzzle geser 3x3 (DOM dibuat lewat JS agar gambar selalu tampil) ---------- */
            function createPuzzleGame(host, done) {
                const N = 3;
                const BLANK = N * N - 1;
                const img = sceneSvg();
                let tiles = [];
                let moves = 0;
                let secs = 0;
                let solved = false;
                let timerId = 0;
                let finishId = 0;
                const tileEls = [];

                const neighbors = (i) => {
                    const r = Math.floor(i / N);
                    const c = i % N;
                    const out = [];
                    if (r > 0) out.push(i - N);
                    if (r < N - 1) out.push(i + N);
                    if (c > 0) out.push(i - 1);
                    if (c < N - 1) out.push(i + 1);
                    return out;
                };

                function shuffleTiles() {
                    tiles = Array.from({ length: N * N }, (_, i) => i);
                    let blank = BLANK;
                    let prev = -1;
                    for (let k = 0; k < 160; k++) {
                        const opts = neighbors(blank).filter((n) => n !== prev);
                        const pick = opts[Math.floor(Math.random() * opts.length)];
                        tiles[blank] = tiles[pick];
                        tiles[pick] = BLANK;
                        prev = blank;
                        blank = pick;
                    }
                    if (tiles.every((v, i) => v === i)) shuffleTiles();
                }

                host.innerHTML =
                    '<div class="hud">' + hudPill('Langkah', 'pz-moves', 0) + hudPill('Waktu', 'pz-time', '0:00') + '</div>' +
                    '<div class="pz-board" id="pz-board"><div class="pz-field" id="pz-field"></div></div>' +
                    '<p id="pz-msg" class="game-sub mt-4 text-center text-sm">Ketuk kepingan di sebelah ruang kosong untuk menggesernya.</p>' +
                    '<div class="mt-3 flex flex-wrap justify-center gap-3"><button type="button" class="game-btn ghost" id="pz-hint">\u{1F441} Lihat Gambar Acuan</button>' +
                    '<button type="button" class="game-btn ghost" id="pz-shuffle">\u{1F500} Acak Ulang</button></div>' +
                    '<div id="pz-preview" class="mt-4 hidden text-center"><img alt="Gambar acuan: gapura candi bentar Blambangan dengan gunung, laut, dan perahu layar" class="mx-auto w-44 rounded-xl border-2 border-gold shadow-lg"></div>';
                $('#pz-preview img', host).src = img;

                const field = $('#pz-field', host);
                const board = $('#pz-board', host);

                for (let v = 0; v <= BLANK; v++) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'pz-tile';
                    btn.setAttribute('aria-label', 'Kepingan ' + (v + 1));
                    const pic = document.createElement('span');
                    pic.className = 'pz-img';
                    pic.style.backgroundImage = 'url("' + img + '")';
                    pic.style.backgroundSize = (N * 100) + '% ' + (N * 100) + '%';
                    pic.style.backgroundPosition = ((v % N) * 100 / (N - 1)) + '% ' + (Math.floor(v / N) * 100 / (N - 1)) + '%';
                    const no = document.createElement('span');
                    no.className = 'pz-no';
                    no.textContent = String(v + 1);
                    btn.append(pic, no);
                    btn.addEventListener('click', () => move(v));
                    if (v === BLANK) { btn.style.display = 'none'; btn.tabIndex = -1; btn.setAttribute('aria-hidden', 'true'); }
                    field.appendChild(btn);
                    tileEls[v] = btn;
                }

                function layout() {
                    tiles.forEach((v, pos) => {
                        tileEls[v].style.left = (pos % N) * (100 / N) + '%';
                        tileEls[v].style.top = Math.floor(pos / N) * (100 / N) + '%';
                    });
                }

                function move(v) {
                    if (solved) return;
                    const pos = tiles.indexOf(v);
                    const blank = tiles.indexOf(BLANK);
                    if (!neighbors(blank).includes(pos)) return;
                    tiles[blank] = v;
                    tiles[pos] = BLANK;
                    moves += 1;
                    $('#pz-moves', host).textContent = String(moves);
                    layout();
                    if (tiles.every((t, i) => t === i)) {
                        solved = true;
                        clearInterval(timerId);
                        tileEls.forEach((el) => { el.tabIndex = -1; });
                        tileEls[BLANK].style.display = 'block';
                        setTimeout(() => board.classList.add('won'), 250);
                        burst(40);
                        $('#pz-msg', host).innerHTML = '<span class="win-banner inline-block rounded-full bg-gold px-4 py-1.5 font-bold text-ink">Gapura utuh kembali! Hebat!</span>';
                        announce('Puzzle selesai dalam ' + moves + ' langkah.');
                        finishId = setTimeout(() => done(Math.round(clamp(1000 - Math.max(0, moves - 25) * 8 - secs * 2, 250, 1000)), moves + ' langkah dalam ' + fmtTime(secs)), 2200);
                    }
                }

                function startRound() {
                    shuffleTiles();
                    moves = 0;
                    secs = 0;
                    $('#pz-moves', host).textContent = '0';
                    $('#pz-time', host).textContent = '0:00';
                    layout();
                    clearInterval(timerId);
                    timerId = setInterval(() => {
                        secs += 1;
                        const el = $('#pz-time', host);
                        if (el) el.textContent = fmtTime(secs);
                    }, 1000);
                }

                $('#pz-hint', host).addEventListener('click', () => {
                    const p = $('#pz-preview', host);
                    p.classList.toggle('hidden');
                    $('#pz-hint', host).textContent = (p.classList.contains('hidden') ? '\u{1F441} Lihat' : '\u{1F648} Sembunyikan') + ' Gambar Acuan';
                });
                $('#pz-shuffle', host).addEventListener('click', () => { if (!solved) startRound(); });
                startRound();
                return { destroy() { clearInterval(timerId); clearTimeout(finishId); } };
            }

            /* ---------- Game 2: Kartu pasangan (kartu 3D yang bisa dibalik) ---------- */
            function createMemoryGame(host, done) {
                const PAIRS = [
                    ['Prabu Tawang Alun', 'Raja abad ke-17, berpusat di Macanputih'],
                    ['Wong Agung Wilis', 'Pemimpin perlawanan melawan VOC tahun 1767'],
                    ['Pangeran Jagapati', 'Pemimpin Perang Bayu (Mas Rempeg)'],
                    ['Puputan', 'Bertempur habis-habisan, pantang menyerah'],
                    ['Desa Bayu', 'Pusat pertempuran Perang Bayu, Songgon'],
                    ['18 Desember 1771', 'Puncak Perang Bayu, Hari Jadi Banyuwangi']
                ];
                const cards = shuffle(PAIRS.flatMap((p, i) => [{ pid: i, text: p[0], term: true }, { pid: i, text: p[1], term: false }]));
                const sun = '<svg viewBox="0 0 40 40" class="h-10 w-10" aria-hidden="true"><g fill="none" stroke="#e8c98a" stroke-width="2" stroke-linecap="round"><circle cx="20" cy="20" r="7" fill="#c8963e"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6M8 8l4 4M28 28l4 4M32 8l-4 4M12 28l-4 4"/></g></svg>';
                let open = [];
                let found = 0;
                let moves = 0;
                let lock = false;
                let flipId = 0;
                let finishId = 0;

                host.innerHTML = '<div class="hud">' + hudPill('Pasangan', 'mm-pairs', '0 / ' + PAIRS.length) + hudPill('Percobaan', 'mm-moves', 0) + '</div>' +
                    '<div class="mem-grid" id="mem-grid">' + cards.map((c, i) =>
                        '<button type="button" class="mem-card" data-i="' + i + '" aria-label="Kartu tertutup"><div class="mem-inner">' +
                        '<div class="mem-face mem-front">' + sun + '</div>' +
                        '<div class="mem-face mem-back ' + (c.term ? 'term' : '') + '"><span class="tag">' + (c.term ? 'Tokoh / Istilah' : 'Keterangan') + '</span><span class="txt">' + esc(c.text) + '</span></div>' +
                        '</div></button>').join('') + '</div>' +
                    '<p id="mm-msg" class="game-sub mt-4 text-center text-sm">Temukan semua pasangan tokoh/istilah dan keterangannya.</p>';

                const els = Array.from(host.querySelectorAll('.mem-card'));

                function setUp(i, up) {
                    els[i].classList.toggle('up', up);
                    els[i].setAttribute('aria-label', up ? cards[i].text : 'Kartu tertutup');
                }

                function flip(i) {
                    if (lock || open.includes(i) || els[i].classList.contains('ok')) return;
                    open.push(i);
                    setUp(i, true);
                    if (open.length < 2) return;
                    moves += 1;
                    $('#mm-moves', host).textContent = String(moves);
                    const [a, b] = open;
                    if (cards[a].pid === cards[b].pid) {
                        found += 1;
                        $('#mm-pairs', host).textContent = found + ' / ' + PAIRS.length;
                        setTimeout(() => { els[a].classList.add('ok'); els[b].classList.add('ok'); }, 350);
                        open = [];
                        burst(10);
                        if (found === PAIRS.length) {
                            announce('Semua pasangan ditemukan.');
                            burst(40);
                            $('#mm-msg', host).innerHTML = '<span class="win-banner inline-block rounded-full bg-gold px-4 py-1.5 font-bold text-ink">Semua pasangan ditemukan!</span>';
                            finishId = setTimeout(() => done(Math.round(clamp(1000 - Math.max(0, moves - 8) * 60, 250, 1000)), moves + ' percobaan'), 2000);
                        }
                    } else {
                        lock = true;
                        flipId = setTimeout(() => { els[a].classList.add('bad'); els[b].classList.add('bad'); }, 450);
                        setTimeout(() => {
                            [a, b].forEach((k) => { els[k].classList.remove('bad'); setUp(k, false); });
                            open = [];
                            lock = false;
                        }, 1250);
                    }
                }

                host.addEventListener('click', (e) => {
                    const b = e.target.closest('.mem-card');
                    if (b) flip(Number(b.dataset.i));
                });
                return { destroy() { clearTimeout(flipId); clearTimeout(finishId); lock = true; } };
            }

            const GAME_ENGINES = { puzzle: createPuzzleGame, memory: createMemoryGame };

            function createGameView(round) {
                const ac = new AbortController();
                const key = GAME_ROUNDS[round].game;
                const meta = GAME_META[key];
                let root = null;
                let active = null;

                const G = () => state.game.rounds[round];
                const nextLabel = 'Lanjut ke Bab ' + (round + 2);
                const stopActive = () => { if (active) { active.destroy(); active = null; } };
                const head = (label) => '<p class="text-sm font-semibold uppercase tracking-widest text-gold">Mini Game ' + (round + 1) + ' dari ' + GAME_ROUNDS.length + ' &middot; ' + label + '</p>';

                function showIntro() {
                    stopActive();
                    root.innerHTML = '<div class="mx-auto max-w-3xl"><div class="game-stage text-center">' +
                        '<div class="relative">' + head('setelah Bab ' + (round + 1)) +
                        '<div class="mt-3 text-5xl" aria-hidden="true">' + meta.icon + '</div>' +
                        '<h1 data-focus tabindex="-1" class="game-title mt-2 text-3xl sm:text-4xl">' + esc(meta.title) + '</h1>' +
                        '<p class="game-sub mx-auto mt-2 max-w-xl">' + esc(meta.desc) + '</p>' +
                        '<div class="game-panel mx-auto mt-5 max-w-md text-left"><p class="text-sm font-bold uppercase tracking-widest text-gold">Cara Bermain</p><ol class="mt-2 space-y-1.5 text-sm">' +
                        meta.rules.map((r, i) => '<li class="flex gap-2"><span class="font-bold text-gold">' + (i + 1) + '.</span><span>' + esc(r) + '</span></li>').join('') + '</ol></div>' +
                        '<p class="game-sub mt-4 text-sm">Skor terbaikmu: <strong class="text-gold">' + G().best + '</strong></p>' +
                        '<div class="mt-5 flex flex-wrap justify-center gap-3"><button type="button" data-action="start" data-focus-start class="game-btn gold">Mulai Bermain</button>' +
                        (G().plays > 0 ? '<button type="button" data-action="to-next" class="game-btn ghost">' + nextLabel + ' &rarr;</button>' : '') + '</div></div></div></div>';
                }

                function start() {
                    stopActive();
                    root.innerHTML = '<div class="mx-auto max-w-3xl"><div class="game-stage">' +
                        '<div class="mb-4 text-center">' + head(esc(meta.title)) + '</div><div id="game-host"></div></div></div>';
                    active = GAME_ENGINES[key]($('#game-host', root), finish);
                    window.scrollTo({ top: 0, left: 0 });
                }

                function finish(score, summary) {
                    const r = G();
                    const newBest = score > r.best;
                    r.plays += 1;
                    r.last = score;
                    if (newBest) r.best = score;
                    save();
                    renderStepper();
                    stopActive();
                    const rank = gameRank(score);
                    root.innerHTML = '<div class="mx-auto max-w-2xl"><div class="game-stage text-center"><div class="relative">' +
                        '<p class="text-sm font-semibold uppercase tracking-widest text-gold">Permainan Selesai</p>' +
                        '<div class="mt-3 text-5xl" aria-hidden="true">\u{1F3C6}</div>' +
                        '<h1 data-focus tabindex="-1" class="game-title mt-2 text-3xl sm:text-4xl">' + esc(rank.title) + '</h1>' +
                        '<p class="game-sub mt-1">' + esc(rank.note) + '</p>' +
                        '<p class="game-title mt-5 text-6xl">' + score + '</p><p class="text-sm text-sand/70">poin' + (newBest && r.plays > 1 ? ' &middot; <strong class="text-gold">Rekor baru!</strong>' : '') + '</p>' +
                        '<div class="game-panel mx-auto mt-4 max-w-sm text-sm">' + esc(summary) + ' &middot; skor terbaik <strong class="text-gold">' + r.best + '</strong></div>' +
                        '<div class="mt-6 flex flex-wrap justify-center gap-3"><button type="button" data-action="start" class="game-btn ghost">Main Lagi</button>' +
                        '<button type="button" data-action="to-next" class="game-btn gold">' + nextLabel + ' &rarr;</button></div></div></div></div>';
                    announce('Permainan selesai. Skor ' + score + '.');
                    const h = $('[data-focus]', root);
                    if (h) h.focus({ preventScroll: true });
                    window.scrollTo({ top: 0, left: 0 });
                }

                return {
                    mount(el) {
                        root = el;
                        showIntro();
                        root.addEventListener('click', (e) => {
                            const btn = e.target.closest('[data-action]');
                            if (!btn || !root.contains(btn) || btn.disabled) return;
                            if (btn.dataset.action === 'start') start();
                            if (btn.dataset.action === 'to-next') requestStage('bab' + (round + 2));
                        }, { signal: ac.signal });
                    },
                    destroy() {
                        ac.abort();
                        stopActive();
                    }
                };
            }

            /* =====================================================================
               10. VIEW: DASHBOARD HASIL
               ===================================================================== */
            function createResultView() {
                const ac = new AbortController();
                return {
                    mount(root) {
                        const rounds = state.game.rounds;
                        const totalBest = rounds.reduce((sum, r) => sum + r.best, 0);
                        const totalPlays = rounds.reduce((sum, r) => sum + r.plays, 0);
                        const rank = gameRank(totalBest / rounds.length);
                        const stat = (label, value) => '<div class="rounded-xl bg-sand p-4"><dt class="text-sm text-bark/60">' + label + '</dt><dd class="text-2xl font-extrabold text-bark">' + value + '</dd></div>';

                        root.innerHTML =
                            '<div class="mx-auto max-w-4xl space-y-6">' +
                            '<div class="card overflow-hidden"><div class="bg-gradient-to-r from-bark to-clay p-6 text-sand sm:p-8">' +
                            '<p class="text-sm font-semibold uppercase tracking-widest text-gold">Dashboard Hasil Belajar</p>' +
                            '<h1 data-focus tabindex="-1" class="mt-1 font-display text-3xl font-bold sm:text-4xl">Selamat, materi tuntas!</h1>' +
                            '<p class="mt-2 break-words text-sand/90">Siswa: <strong>' + esc(state.name) + '</strong></p></div>' +
                            '<div class="p-6 sm:p-8"><p class="text-bark/80">Kamu telah menyelesaikan seluruh bab tentang Kerajaan Blambangan dan memainkan mini game di sela-sela materi.</p>' +
                            '<p class="mt-4 font-display text-2xl font-bold text-bark">' + esc(rank.title) + '</p><p class="text-bark/70">' + esc(rank.note) + '</p></div></div>' +
                            '<section class="card p-6 sm:p-8"><h2 class="font-display text-2xl font-bold text-bark">Ringkasan Aktivitas</h2>' +
                            '<dl class="mt-4 grid gap-3 sm:grid-cols-3">' +
                            stat('Bab materi selesai', CHAPTERS.filter((c) => state.materi.done[c.id]).length + ' / ' + CHAPTERS.length) +
                            stat('Skor terbaik Game 1', rounds[0].best) +
                            stat('Skor terbaik Game 2', rounds[1].best) +
                            stat('Total skor terbaik', totalBest) +
                            stat('Game dimainkan', totalPlays + 'x') + '</dl></section>' +
                            '<div class="no-print flex flex-wrap gap-3"><button type="button" data-action="print" class="btn btn-primary">Cetak / Simpan PDF</button>' +
                            '<button type="button" data-action="review" class="btn btn-secondary">Pelajari Materi Lagi</button>' +
                            '<button type="button" data-action="restart" class="btn btn-secondary">Mulai Ulang Semua</button></div></div>';

                        root.addEventListener('click', (e) => {
                            const btn = e.target.closest('[data-action]');
                            if (!btn || !root.contains(btn)) return;
                            if (btn.dataset.action === 'print') window.print();
                            if (btn.dataset.action === 'review') go('bab1');
                            if (btn.dataset.action === 'restart') resetAll();
                        }, { signal: ac.signal });

                        burst(36);
                        announce('Dashboard hasil dimuat. Total skor game ' + totalBest + '.');
                    },
                    destroy() { ac.abort(); }
                };
            }

            /* =====================================================================
               9. ROUTER
               ===================================================================== */
            const VIEWS = { daftar: createLandingView, hasil: createResultView };
            STAGES.forEach((st) => {
                if (st.kind === 'bab') VIEWS[st.id] = () => createMateriView(st.idx);
                if (st.kind === 'game') VIEWS[st.id] = () => createGameView(st.idx);
            });

            let currentView = null;

            function replaceHash(id) {
                const target = '#/' + id;
                if (location.hash === target) handleRoute();
                else location.replace(target);
            }

            function mountView(id) {
                const root = $('#app');
                if (currentView) { currentView.destroy(); currentView = null; }
                root.innerHTML = '';
                currentRoute = id;
                currentView = VIEWS[id]();
                currentView.mount(root);
                root.classList.remove('view-enter');
                void root.offsetWidth;
                root.classList.add('view-enter');
                renderStepper();
                const stage = STAGES.find((s) => s.id === id);
                document.title = stage.title + ' | Jejak Blambangan';
                window.scrollTo({ top: 0, left: 0 });
                const focusEl = $('[data-focus-start], [data-focus]', root);
                if (focusEl) focusEl.focus({ preventScroll: true });
            }

            function handleRoute() {
                const match = location.hash.match(/^#\/([a-z0-9]+)\/?$/);
                const id = match ? match[1] : (location.hash === '' || location.hash === '#' ? 'daftar' : null);
                if (id === null || !VIEWS[id]) { replaceHash('daftar'); return; }
                if (!canAccess(id)) {
                    toast(lockReason(id), 'warn');
                    replaceHash(nextStage());
                    return;
                }
                mountView(id);
            }

            /* =====================================================================
               11. INISIALISASI
               ===================================================================== */
            function init() {
                $('#btn-reset').addEventListener('click', resetAll);
                $('#stepper').addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-stage]');
                    if (btn) requestStage(btn.dataset.stage);
                });
                window.addEventListener('hashchange', handleRoute);
                if (!Store.isPersistent) {
                    toast('Penyimpanan peramban tidak tersedia. Progres hanya tersimpan selama halaman terbuka.', 'warn');
                }
                handleRoute();
            }

            init();
        })();
    </script>
</body>

</html>
